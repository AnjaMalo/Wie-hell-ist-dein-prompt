:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#FD5000;--grey:#46555F;--cream:#FDF6F1;--ink:#1D252D;
  --bg:#FDF6F1;--panel:#FFFFFF;--text:#1D252D;--muted:#46555F;--line:#E8DDD4;--soft:#F6ECE4;--night:#0E1720;
  --font:"Lexend",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D252D;--panel:#26313B;--text:#FDF6F1;--muted:#B8C2C9;--line:#3A4752;--soft:#2E3A45}}
:root[data-theme="dark"]{--bg:#1D252D;--panel:#26313B;--text:#FDF6F1;--muted:#B8C2C9;--line:#3A4752;--soft:#2E3A45}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-weight:300;font-size:16px;line-height:1.5}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 28px}
.narrow{max-width:820px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.round{font-size:14px;color:var(--muted);font-weight:400}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--orange);color:#fff}
h1{font-weight:300;font-size:clamp(32px,7vw,56px);line-height:1.02;letter-spacing:-.02em;margin:12px 0 8px}
h1 em{font-style:normal;color:var(--orange);font-weight:600}
.sub{font-size:clamp(16px,3.6vw,20px);color:var(--muted);margin:0 0 16px;max-width:40ch}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:16px}
.btn{border:0;border-radius:6px;padding:12px 20px;font-weight:600;background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);padding:10px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.privacy{font-size:13px;color:var(--muted);margin:12px 0 0}
h2{font-weight:400;font-size:20px;margin:0 0 8px}
/* Lernteil */
.what{font-size:18px;font-weight:400;margin:0 0 18px;padding:12px 14px;background:var(--soft);border-radius:6px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.why div{border-radius:6px;padding:12px 14px}
.why h3{margin:0 0 6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.why ul{margin:0;padding-left:18px;font-size:15px}
.why .hum{background:var(--soft)}
.why .ai{background:var(--night);color:#FDF6F1}.why .ai h3{color:#B8C2C9}
.whyEnd{font-weight:600;color:var(--orange);font-size:17px;margin:12px 0 0}
.lead{color:var(--muted);margin:0 0 12px}
.bbs{display:grid;grid-template-columns:1fr;gap:2px;background:var(--line);border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
@media (min-width:640px){.bbs{grid-template-columns:1fr 1fr}}
.bb{background:var(--panel);padding:12px 14px}
.bb strong{display:flex;align-items:center;gap:8px}
.bb strong::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange)}
.bb p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.bb .e{color:var(--text);font-style:italic}
.bb.hl{background:var(--orange);color:#fff}.bb.hl p,.bb.hl .e{color:#fff}.bb.hl strong::before{background:#fff;box-shadow:none}
.cmp{display:grid;gap:10px;margin-top:12px}
@media (min-width:640px){.cmp{grid-template-columns:1fr 1.6fr}}
.cmp div{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px}
.cmp div.good{border-color:var(--orange)}
.cmp h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cmp em{font-style:normal;font-weight:600;color:var(--orange)}
.startbox{margin-top:20px;padding-top:16px;border-top:1.5px solid var(--line)}
/* Spielfläche */

.status{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.status .lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.status .lvl span{font-size:14px;color:var(--muted)}
.status .lvl b{font-size:24px;color:var(--orange);line-height:1.1}
.status .z{margin:2px 0 8px;font-weight:400}
.status .ans{font-size:14px;color:var(--muted);margin:0}
.status .ans b{color:var(--text);font-weight:600}
.mosaic{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;border-radius:6px;overflow:hidden;background:var(--night)}
.mosaic .tile.wide{grid-column:span 2;aspect-ratio:8/3}
.mosaic.big{grid-template-columns:repeat(3,1fr)}
@media (min-width:560px){.mosaic.big{grid-template-columns:repeat(4,1fr)}}
.mosaic.big .tile .cap .fn,.mosaic.big .tile .cap .nu{display:none!important}
@media (min-width:560px){.mosaic.big .tile.sf .cap .fn{display:-webkit-box!important}}
.tile{position:relative;aspect-ratio:4/3;width:100%;border:0;padding:0;background:var(--night);overflow:hidden;display:block;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:filter 1s ease}
.tile:not(.on) img{filter:brightness(.13) grayscale(.5)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,rgba(5,9,13,.82) 38%);color:#fff;opacity:0;transition:opacity .8s ease .3s;line-height:1.25}
.tile.on .cap{opacity:1}
.tile .cap b{display:block;font-size:14px;font-weight:600}
.tile .cap .fn,.tile .cap .nu{display:none;font-size:12.5px;font-weight:300;margin-top:2px;overflow:hidden;display:none;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tile .cap .nu{color:#FFC7A8}
.tile.sf .cap .fn,.tile.sn .cap .nu{display:-webkit-box}
.mosaic.big .tile .cap b{font-size:12px}
@media (min-width:560px){.mosaic.big .tile .cap b{font-size:13px}.mosaic.big .tile .cap .fn{font-size:11.5px}}
.tile.new::before{content:"";position:absolute;inset:0;border:3px solid var(--orange);z-index:2;animation:ring 1.6s ease-out 2;pointer-events:none}
@keyframes ring{0%{opacity:1}100%{opacity:0}}
.tile.tlogo{grid-column:span 3;aspect-ratio:auto;min-height:56px;display:flex;align-items:center;justify-content:center;background:#3a1a0c;transition:background 1s}
@media (min-width:560px){.tile.tlogo{grid-column:span 2}}
.tile.tlogo.on{background:var(--orange)}
.tile.tlogo img{width:auto;height:30px;max-width:70%;object-fit:contain;filter:none;opacity:.35;transition:opacity 1s}
.tile.tlogo.on img{opacity:1}
.meter{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin:8px 2px 0;font-weight:400}
.meter b{color:var(--orange)}
.hint{font-size:14px;color:var(--orange);font-weight:600;margin:6px 2px 0;min-height:1em}
.bbox{margin-top:12px}
.bbox h3{font-size:15px;font-weight:600;margin:0 0 6px}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.sw{display:flex;align-items:center;gap:10px;font-size:14px}
.sw i{flex:none;width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;transition:background .3s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .3s}
.sw.on i{background:var(--orange);box-shadow:0 0 10px var(--orange)}
.sw.on i::after{left:18px}
.tips{margin:10px 0 0;padding-left:20px;font-size:15px}
.instr{font-weight:600;font-size:17px;margin:0 0 8px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.chip .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:5px;transition:background .6s,box-shadow .6s}
.chip.lit .dot{background:var(--orange);box-shadow:0 0 12px var(--orange)}
.chip strong{display:block;font-size:15px;line-height:1.3}
.chip span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.chip.sel{border-color:var(--orange);box-shadow:inset 0 0 0 1.5px var(--orange);background:var(--soft)}
.chip.sel strong::after{content:" \2713";color:var(--orange)}
.chips-pulse .chip{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{50%{border-color:var(--orange)}}
.task{font-weight:600;font-size:16px;margin:0 0 8px;display:block}
textarea{width:100%;min-height:130px;font:inherit;font-size:16px;font-weight:300;padding:12px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);resize:vertical}
textarea:focus{border-color:var(--orange);outline:none}
.msg{font-size:14px;color:var(--orange);font-weight:600;margin-top:8px}
.coach{margin-top:16px;border-left:4px solid var(--orange);padding:4px 0 4px 14px}
.coach p{margin:0 0 8px;font-weight:600}
.ex{background:var(--soft);border-radius:6px;padding:12px 14px;font-size:15px}
.ex span.m{background:linear-gradient(transparent 60%,rgba(253,80,0,.28) 60%)}
.ex .lbl{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--orange);border-radius:3px;padding:0 5px;margin-right:4px;vertical-align:1px}
/* Finale */
.finale .core{font-size:clamp(26px,5vw,36px);font-weight:300;line-height:1.15;margin:4px 0 14px;letter-spacing:-.01em}
.badge{background:var(--orange);color:#fff;border-radius:6px;padding:16px}
.badge .t{font-size:clamp(30px,7vw,42px);font-weight:600;line-height:1}
.badge p{margin:6px 0 0}
.facts{list-style:none;padding:0;margin:14px 0;display:grid;gap:6px}
.facts li{border-left:3px solid var(--orange);padding:2px 0 2px 10px}
.save{border:1.5px dashed var(--orange);border-radius:6px;padding:12px 14px;margin:14px 0}
.save ol{margin:6px 0 0;padding-left:20px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.links a{color:var(--text);border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;text-decoration:none;font-weight:400}
.claim{font-size:20px;font-weight:600;color:var(--orange);margin:18px 0 0}
.small{font-size:13px;color:var(--muted)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:22px}
footer .privacy{flex:1 1 260px;margin:0}
.logo{height:26px;width:auto}
.logo.d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.l{display:none}:root:not([data-theme="light"]) .logo.d{display:inline}}
:root[data-theme="dark"] .logo.l{display:none}:root[data-theme="dark"] .logo.d{display:inline}
/* Infokarte */
.backdrop{position:fixed;inset:0;background:rgba(5,9,13,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:14px 14px 0 0;max-height:80%;overflow:auto;visibility:hidden;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s ease,visibility 0s linear .3s;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .3s ease,visibility 0s}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .x{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:15px;color:var(--muted);padding:8px}
.sheet .cap{font-size:14px;color:var(--muted);margin:0 70px 4px 0}
.sheet h3{margin:0 0 10px;font-size:21px;font-weight:600}
.sheet img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;margin-bottom:10px}
.sheet p{margin:0 0 8px}
.sheet .nav{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cards4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.acard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.acard div{padding:10px 12px}
.acard strong{display:block;font-size:16px;line-height:1.3}
.acard span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.acard.done{border-color:var(--orange)}
.acard.done strong::after{content:" \2713";color:var(--orange)}
.areahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.areahead h2{margin:0}
.areahead span{font-size:14px;color:var(--muted)}
.result{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:14px;margin-top:10px}
.result .lvl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 2px}
.result .lvl span{font-size:14px;color:var(--muted)}
.result .lvl b{font-size:20px;color:var(--orange)}
.result .z{margin:0 0 8px;font-weight:600;font-size:17px}
.result .ans{font-size:14px;color:var(--muted);margin:0 0 12px}
.result .ans b{color:var(--text)}
.result h3{font-size:15px;font-weight:600;margin:0 0 6px}
.donebox{background:var(--panel);border:1.5px solid var(--orange);border-radius:6px;padding:14px;margin-top:10px}
.donebox p{margin:0 0 10px;font-weight:400}
.donebox .btn{width:100%;margin-top:8px}
</style>
</head>

 power of light."}, "linkWeb": {"de": "Mehr über ams OSRAM: ams-osram.com", "en": "More about ams OSRAM: ams-osram.com"}, "linkJobs": {"de": "Karriere bei ams OSRAM: jobs.ams-osram.com", "en": "Careers at ams OSRAM: jobs.ams-osram.com"}, "facts": [{"de": "Nr. 1 bei Lichtsensoren (Marktanteil 2024, OMDIA)", "en": "#1 in light sensors (2024 market share, OMDIA)"}, {"de": "Nr. 1 bei Packaged LEDs (Marktanteil 2025, TrendForce)", "en": "#1 in packaged LEDs (2025 market share, TrendForce)"}, {"de": "Nr. 1 bei Autolampen (Marktanteil 2025, eigenes Marktmodell)", "en": "#1 in automotive lamps (2025 market share, own market model)"}]}, "bb": [{"name": {"de": "Rolle der KI", "en": "Role of AI"}, "q": {"de": "Welche Rolle soll die KI übernehmen?", "en": "What role should the AI play?"}, "ex": {"de": "Du bist Ingenieurin für Fahrzeugtechnik.", "en": "You are an automotive engineer."}, "tip": {"de": "Gib der KI eine Rolle: „Du bist …“", "en": "Give the AI a role: \"You are …\""}}, {"name": {"de": "Deine Position", "en": "Your position"}, "q": {"de": "Wer bist du, was machst du?", "en": "Who are you, what do you do?"}, "ex": {"de": "Ich bin Schülerin und interessiere mich für Technik.", "en": "I'm a student and interested in technology."}, "tip": {"de": "Sag, wer du bist: „Ich bin …“", "en": "Say who you are: \"I am …\""}}, {"name": {"de": "Kontext", "en": "Context"}, "q": {"de": "Situation, Ziel, Erwartung", "en": "Situation, goal, expectation"}, "ex": {"de": "Ich halte nächste Woche ein Referat.", "en": "I'm giving a presentation next week."}, "tip": {"de": "Erkläre die Situation: Wofür brauchst du die Antwort?", "en": "Explain the situation: what do you need the answer for?"}}, {"name": {"de": "Auftrag", "en": "Assignment"}, "q": {"de": "Gib der KI eine klare Anweisung.", "en": "Give the AI clear instructions."}, "ex": {"de": "Erkläre, wo ams OSRAM im Auto steckt. Erfinde nichts.", "en": "Explain where ams OSRAM is found in cars. Don't make anything up."}, "tip": {"de": "Gib n von ams OSRAM im Auto stecken. Erfinde nichts. Antworte in fünf Stichpunkten und in einfacher Sprache. Vorlage: Beantworte jeden Punkt mit drei Fragen: Wo steckt es? Was macht es? Was habe ich davon?", "en": "You are an automotive engineer. I'm a student interested in cars. I'm giving a presentation on car technology next week. Explain where light and sensors from ams OSRAM are found in cars. Don't make anything up. Answer in five bullet points in simple language. Template: answer each point with three questions: Where is it? What does it do? What's in it for me?"}, "hot": [{"title": {"de": "Scheinwerfer", "en": "Headlights"}, "fn": {"de": "Matrix-LEDs passen den Lichtkegel dynamisch an", "en": "Matrix LEDs adapt the light beam dynamically"}, "nu": {"de": "die Straße ist optimal ausgeleuchtet", "en": "the road is perfectly lit"}, "easy": {"de": "In modernen Scheinwerfern stecken LEDs von ams OSRAM. Matrix-LEDs mit vielen einzelnen Lichtpunkten passen den Lichtkegel laufend an und ermöglichen sogar Projektionen auf die Straße.", "en": "Modern headlights use LEDs from ams OSRAM. Matrix LEDs with many individual pixels continuously adapt the light beam and even allow projections onto the road."}, "tech": {"de": "Von effizienten Standard-Lichtquellen bis zu hochauflösenden Multipixel-LEDs: Sie ermöglichen eine dynamische Anpassung des Lichtkegels und Projektionen auf die Fahrbahn.", "en": "From efficient standard light sources to high-resolution multipixel LEDs that allow dynamic beam adaptation and projections on the road."}, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGIAaYDASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAAECAwQFBgf/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAflALAAGmXUWU0wBgAAAUtB0OgYA+hOfovms25yZRGxh0bclb8iUACgAIAEADEMEMEMEAIA5AIAAYyqmxsYAxDACg1V0D3 ng up. Answer in five bullet points using technical terms. Template: answer each point with three questions: Where is it? What does it do? What's in it for me?"}, "hot": [{"title": {"de": "Roboter", "en": "Robots"}, "fn": {"de": "3D-Erfassung der Umgebung", "en": "3D environment scanning"}, "nu": {"de": "Roboter erkennen Hindernisse und arbeiten sicher mit Menschen", "en": "robots detect obstacles and interact safely with people"}, "easy": {"de": "Roboter brauchen Augen. Sensoren und Licht von ams OSRAM helfen ihnen, Hindernisse zu erkennen, Zusammenstöße zu vermeiden und sicher mit Menschen zu interagieren, auch im Haushalt.", "en": "Robots need eyes. Sensors and light from ams OSRAM help them detect obstacles, avoid collisions and interact safely with people, at home too."}, "tech": {"de": "3D-Umgebungserfassung und fortschrittliche Mensch-Maschine-Interaktion: von Hinderniserkennung und Kollisionsvermeidung bis zur präzisen Positionierung, ergänzt um optische Kraft-, Temperatur- und Spektralsensorik, besonders für Haushaltsroboter.", "en": "3D environment scanning and advanced human-machine interaction – from obstacle detection and collision avoidance to precise positioning control, plus optical force sensing, temperature sensing and spectral sensing, especially for household robots."}, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGJAaMDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAGLi/R5G4hJxcrYxyTVtWSu9VpTHjZ5fSz89fZ24c3SgaZTcZZ8Wd9RcyMvUs5enWdlLaZy9azSBcoYIAAAAAAAAAAAAAAKGi5coSVyjKJSi1kIWy6E5ZZ9OJPP0SWOinC029yEbLeLjoldtKTasTm+rpwdWx38zVc7IxlLPPfZWIlHfIAEMENAAAAAAAAAAFBIuVIFJIJODllZVplk0Lfx+r55KetxPQY649Wh2Q8z1+LLXZG5mqF1OsRcXnrd6LzHQl2LfybOu6Jl12HUWZN1GsUAawAAAIYIaAAAABiAKmFywSggbTJ6s2rO1U8pbwunCXn+gm5VOE or their growth. This means less fertilizer and less energy."}, "tech": {"de": "Präzise, energieeffiziente LEDs und Spektralsensoren für die Lebensmittelproduktion in kontrollierter Umgebung: Anpassung an verschiedene Pflanzen, Wachstumsüberwachung, bessere Ernten, weniger Dünger und geringere Energiekosten.", "en": "Precise, energy-efficient LEDs and advanced spectral sensors offer the possibility to adapt to the needs of different plants, monitoring their growth, optimizing harvests, minimizing fertilizer use and reducing energy costs."}, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAGGAf4DASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xAAZAQADAQEBAAAAAAAAAAAAAAABAgMABAX/2gAMAwEAAhADEAAAAdDQgFZNCAjpBbCAWZvUleDCSJ4X7aPHM+Tj+O7z3cnOys2q6YXWywts8euXK1A+mv62ARqa28cEUW8HoprYccr5EVKhzXMehHQ0piBEy6TQ5YZ0JWZjVDO91gZNal1Edhzhr2Ea3z6zcjocFXr1qjP2HCDU1X1YQ93yp26mRRizQlFQIE3Lhr/C4m1D8BLGj1zyU7qsN5oxFM5ZoLsyG1t1yqLv4rRuFrpRsyzhzS0i0WE0LiLM2d10G83EHUUDa07LKyKhmVWKyLPhdHQ/EGUXHD4Xmou6TaC80SbFZwVNqQ0Z1LMSqi0XlfqgtMyYs65bohMcyFrlstmK9EKETeNGOhOueW6uzmaqJBRK6Tq13UMDCejpJJpcT5x/Wr0QViuZ0uP2wuMUlTMe9w63lQVNBqKXArZ07UkUxmHtubqSL2hZZfpcMFjJOaYNFbO1rpOjKK9iC55AuTMqpbwV0gzwbOundUUJMS8fmdxTsJTPlVe5Ivqom9sxCg0BmIwKcR3TS6WJwokCE3nOJfXiu/XzzWCIpo0wblF00ulVZ/OCfaKYapRC69BoIq64810gLOrpaWjMIcgwNkKWLqkRKQQLgWlAanHcc9Fvwun6dSWHthMZwbl6pQdxUE3q1Zr/AEodvXXZrh2ayYGGbL69VPu3XIozWSySlFjpNxzOejF8wz7ZZ9heI9CRYcr01k3m5VyTT1oi2tlQbRPVNEU1UWAZdLUE3udYQDz8wJ4Jdb19IulJD0sq109TezBPbf7EXtoi0cssnZPnc0q/WdoxWGzgKUB5q2SLoigArkCvQB4mite1kkNJX4u1AE2AjNGtCjwzEtHMPdLh3Tbs2VEOIOy28ZXSx5SiMTR1rs4caGs2V2ZrSOtnm2Do7vRVzfFyPHVyClfXppLM1yg0F+amttmRjCEk54qjXo2I6u1eauY9l+p1Vet5+MqhacbslbhVOPlxF1upVPkum90bi1511xXpi0QoWUx43Rp0Ucu7Rpu1Z0uSnkSAJhshVQStvWzIxn0s+Xua8Yry6BJnWRxfVnsCsuYyMpxJVQaypu6wVpFa5kHRiLVBFoIY6hTqAFnm46ONq5 // ---------- Erkennung ----------
const RX = [
  /(du bist|sei (ein|eine|der|die)\b|agiere als|handle als|verhalte dich (wie|als)|stell dir vor,? du (bist|wärst)|schlüpf in die rolle|in der rolle (eines|einer|als)|antworte als|als (erfahrene[rn]? |ein |eine )?(experte|expertin|lehrer|lehrerin|ingenieur|ingenieurin|coach|berater|beraterin|professor|professorin|verkäufer|verkäuferin)\b[^.]*\b(erklär|antwort|beschreib|nenn)|\bact as\b|\byou are\b|\byou're an?\b|imagine you are|pretend (to be|you are)|take the role)/,
  /(\bich bin\b|\bich arbeite\b|\bich studiere\b|\bich gehe (in|zur|auf)\b|ausbildung|mein(e)? (beruf|job|rolle|klasse|firma|team)|\bi am\b|\bi'm\b|\bi work\b|\bi study\b|\bmy (job|role|class)\b)/,
  /(\bweil\b|\bda ich\b|\bdamit\b|\bum (zu|mehr)\b|hintergrund|situation|ziel|\b(will|möchte|möchten|wollen|wollte|plane|planen|brauche|suche|überlege|überlegen)\b|vorhab|kaufen|\bkauf|anschaff|\bbald\b|morgen|nächste woche|referat|präsentation|vortrag|hausaufgabe|prüfung|schule|studium|\bfür (mein|meine|meinen|unser|unsere|unseren)\b|interessier|neugierig|\bbecause\b|consider|planning|\bplan to\b|\bwant\b|\bneed\b|\bbuy\b|\bsoon\b|looking for|\bgoal\b|\bfor my\b|\bfor our\b|background|presentation|homework|school|interested|curious)/,
  /(erklär|beschreib|\bnenn|\bliste\b|\bzeig|fass[^.]*zusammen|vergleich|gib mir|schreib|stell[^.]*dar|\bwelche[rsnm]?\b|\bwo (steckt|stecken|findet|finde|ist|sind|begegnet|begegnen|kommt|kommen|vorkommt|vorkommen)\b|\bwas macht\b|explain|\blist\b|describe|\bshow\b|compare|give me|\bwrite\b|tell me|summari[sz]e|\bwhere (is|are|does|do|can)\b|\bwhat does\b|\bwhich\b)/,
  /((\b\d+|zwei|drei|vier|fünf|sechs|sieben|acht|zehn|two|three|four|five|six|ten)\s*(kurze[n]? )?(punkte|stichpunkte|sätze|sätzen|beispiele|zeilen|wörter|wörtern|bullet|points|sentences|examples|words|lines))|tabelle|\btable\b|stichpunkt|aufzählung|bullet|maximal|höchstens|at most|\bmax\.|\bkurz\b|\bshort\b|\bbrief\b|einfache[rn]? sprache|einfachen worten|einfach erklärt|simple (language|words|english)|fachbegriff|technical terms|\bformat\b|\bton\b|\btone\b|locker|formell|freundlich|\blength\b|\blänge\b/,
  /(vorlage|beispiel:|nach diesem muster|orientiere dich|so soll (jeder|die|das|es)|im format:|\btemplate\b|example:|like this:|follow this)/
];
const TECH = /(technisch|fachbegriff|ingenieur|engineer|technical|entwickler|developer|physik|physics|promov|\bphd\b|\bdr\.|detail)/;
const EASY = /(einfach|simple|schüler|\bkind\b|kinder|anfänger|laie|beginner|\bkid)/;
const NUM = {zwei:2,drei:3,vier:4,'fünf':5,two:2,three:3,four:4,five:5};
function analyse(text){
  const clean = text.split('\n').filter(l => !/…|\.\.\./.test(l)).join(' ').toLowerCase();
  const bb = RX.map(r => r.test(clean));
  const n = bb.filter(Boolean).length;
  const m = clean.match(/\b(\d|zwei|drei|vier|fünf|two|three|four|five)\s*(kurze[n]? )?(punkte|stichpunkte|beispiele|bullet|points|examples|stellen|places|anwendungen|applications)/);
  const want = m ? (NUM[m[1]] || parseInt(m[1],10)) : 0;
  return {bb, n, want, tech: TECH.test(clean) && !EASY.test(clean), tpl: bb[5]};
}

// ---------- Zustand ----------
const AREA = Object.fromEntries(D.areas.map(a => [a.key, a]));
const KEYS = D.areas.map(a => a.key);
const unlockedCount = (n,k) => n <= 1 ? 1 : n <= 3 ? 2 : n === 4 ? 3 : n === 5 ? 4 : k;
const titleIdx = n => n <= 2 ? 0 : n <= 4 ? 1 : n === 5 ? 2 : 3;
const fresh = () => ({view:'learn', cur:null, round:0, open:{mob:0,mow:0,ind:0,lig:0}, fn:{}, nu:{}, tech:{}, done:{}, last:null, tapShown:false, newIdx:[], busy:false});
let S = fresh();

// ---------- Ansichten ----------
function show(v){
  S.view = v; closeSheet();
  ['Learn','Pick','Play','End'].forEach(x => $('view'+x).hidden = (x.toLowerCase() !== v));
  staticTexts(); window.scrollTo({top:0});
  if(v === 'pick') renderPick();
  if(v === 'play') renderPlay();
  if(v === 'end') renderEnd();
}
function renderPick(){
  $('cards4').innerHTML = D.areas.map(a => `<button class="acard${S.done[a.key]?' done':''}" data-k="${a.key}"><img alt="" src="${a.hot[0].img}"><div><strong>${esc(T(a.name))}</strong><span>${esc(T(a.sub))}</span></div></button>`).join('');
  $('cards4').querySelectorAll('[data-k]').forEach(b => b.onclick = () => pick(b.dataset.k));
  const lit = KEYS.filter(k => S.open[k] > 0).length;
  $('progress').textContent = lit ? u('progress').replace('{n}', lit) : '';
}
function pick(k){
  S.cur = k; S.round = 1; S.last = null; S.newIdx = [];
  $('prompt').value = ''; $('msg').textContent = '';
  show('play');
  setTimeout(() => $('prompt').focus({preventScroll:true}), 60);
}

// ---------- Bereich ----------
function tileHTML(h){ return `<img alt="" src="${h.img}"><div class="cap"><b>${esc(T(h.title))}</b><span class="fn">${esc(T(h.fn))}</span><span class="nu">${esc(T(h.nu))}</span></div>`; }
function renderPlay(){
  const k = S.cur, a = AREA[k];
  $('aName').textContent = T(a.name); $('aSub').textContent = T(a.sub);
  const m = $('mosaic'); m.innerHTML = '';
  a.hot.forEach((h,i) => {
    const b = document.createElement('button');
    const on = i < S.open[k];
    b.className = 'tile' + (on ? ' on' : '') + (on && (S.fn[k] || S.done[k]) ? ' sf' : '') + (on && (S.nu[k] || S.done[k]) ? ' sn' : '') + (a.hot.length % 2 && i === a.hot.length-1 ? ' wide' : '') + (S.newIdx.includes(i) ? ' new' : '');
    b.innerHTML = tileHTML(h); b.setAttribute('aria-label', on ? T(h.title) : T(a.name));
    b.onclick = () => openSheet(k, i);
    m.appendChild(b);
  });
  $('brVal').textContent = Math.round(S.open[k] / a.hot.length * 100) + ' %';
  $('tapHint').textContent = S.open[k] > 0 ? u('tapHint') : '';
  const complete = !!S.done[k];
  $('result').hidden = !S.last || complete; $('playPanel').hidden = complete; $('donebox').hidden = !complete;
  if(S.last && !complete) renderResult();
  $('coachEx').hidden = complete || !(S.last && S.last.showEx);
  if(!$('coachEx').hidden) renderCoachEx();
  $('sendBtn').disabled = S.round > 3;
  roundLabel();
}
function renderResult(){
  const r = S.last.r, a = AREA[S.cur], ti = D.titles[titleIdx(r.n)];
  $('lvlZ').textContent = T(ti.z);
  const hs = a.hot.slice(0, S.open[S.cur]);
  const tpl = hs.length === 1 ? u('ans1') : u('ansN');
  const line = tpl.replace('{n}', hs.length).replace(lang==='de'?'{Bereich}':'{area}', T(a.name))
    .replace(/\{Titel\}|\{title\}|\{titles\}/, hs.map(h => T(h.title)).join(', '));
  $('ans').innerHTML = `<b>${esc(u('answerHead'))}:</b> ${esc(line)}`;
  $('switches').innerHTML = D.bb.map((b,i) => `<div class="sw ${r.bb[i]?'on':''}"><i></i>${esc(T(b.name))}</div>`).join('');
  $('tips').innerHTML = D.bb.filter((b,i) => !r.bb[i]).map(b => `<li>${esc(T(b.tip))}</li>`).join('');
  $('improveBtn').hidden = S.round > 3;
}
function renderCoachEx(){
  const a = AREA[S.cur];
  const parts = T(a.example).replace(/\.\s+/g, '.\u0000').split('\u0000');
  const map = [0,1,2,3,3,4,5];
  $('exText').innerHTML = parts.map((p,i) => { const b = map[i] ?? 5; const first = map.indexOf(b) === i;
    return (first ? `<span class="lbl">${esc(T(D.bb[b].name))}</span>` : '') + `<span class="m">${esc(p)}</span> `; }).join('');
}
function roundLabel(){ $('roundLbl').textContent = (S.view === 'play' && S.cur && !S.done[S.cur]) ? u('round').replace('{n}', Math.min(S.round,3)) : ''; }

async function aiCheck(text){
  if(location.protocol === 'file:') return null;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 8000);
  try{
    const res = await fetch('/api/check', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt: text}), signal: ctrl.signal});
    if(!res.ok) return null;
    const d = await res.json();
    if(!Array.isArray(d.bb) || d.bb.length !== 6) return null;
    return d;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}
async function send(){
  if(S.busy) return;
  const text = $('prompt').value.trim();
  if(!text){ $('msg').textContent = u('empty'); $('prompt').focus(); return; }
  S.busy = true; $('sendBtn').disabled = true; $('msg').textContent = u('checking');
  const r = analyse(text);                 // Signalwörter als Rückfallebene
  const ai = await aiCheck(text.slice(0, 1500));
  if(ai){ r.bb = ai.bb.map(Boolean); r.n = r.bb.filter(Boolean).length; r.tpl = r.bb[5]; if(typeof ai.tech === 'boolean') r.tech = ai.tech; r.src = 'ki'; }
  else r.src = 'regeln';
  S.busy = false; $('sendBtn').disabled = false; $('msg').textContent = '';
  const k = S.cur, a = AREA[k];
  const before = S.open[k];
  const cnt = Math.min(a.hot.length, Math.max(before, unlockedCount(r.n, a.hot.length)));
  S.open[k] = cnt; if(r.n >= 2 || r.tpl) S.fn[k] = true; if(r.tpl) S.nu[k] = true; S.tech[k] = r.tech;
  S.newIdx = []; for(let i = before; i < cnt; i++) S.newIdx.push(i);
  r.showEx = S.round >= 2 && r.n <= 2;
  S.last = {r, showEx:r.showEx};
  S.round++;
  if(cnt >= a.hot.length) S.done[k] = true;
  renderPlay(); go($('viewPlay'));
}
function completeArea(){
  const k = S.cur; S.newIdx = []; for(let i = S.open[k]; i < AREA[k].hot.length; i++) S.newIdx.push(i);
  S.open[k] = AREA[k].hot.length; S.done[k] = true; renderPlay(); go($('viewPlay'));
}
function renderEnd(){
  $('core').textContent = u('core');
  const bm = $('bigMosaic'); bm.innerHTML = '';
  const all = []; const max = Math.max(...D.areas.map(a => a.hot.length));
  for(let i=0;i<max;i++) D.areas.forEach(a => { if(a.hot[i]) all.push([a.key,i]); });
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for(let i = all.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  all.forEach(([k,i], n) => {
    const b = document.createElement('button'); b.className = 'tile sf'; b.innerHTML = tileHTML(AREA[k].hot[i]);
    b.onclick = () => openSheet(k, i, true); bm.appendChild(b);
    setTimeout(() => b.classList.add('on','new'), reduce() ? 0 : 80 + n*90);
  });
  const lg = document.createElement('div'); lg.className = 'tile tlogo on'; lg.innerHTML = `<img alt="ams OSRAM" src="${LOGO_D}">`; bm.appendChild(lg);
  $('facts').innerHTML = D.ui.facts.map(f => `<li>${esc(T(f))}</li>`).join('');
  $('saveHead').textContent = u('saveHead');
  $('saveList').innerHTML = D.bb.map(b => `<li><strong>${esc(T(b.name))}</strong>: ${esc(T(b.q))}</li>`).join('');
  $('transp').textContent = u('transp'); $('lWeb').textContent = u('linkWeb'); $('lJobs').textContent = u('linkJobs'); $('claim').textContent = u('claim');
}

// ---------- Texte ----------
function staticTexts(){
  document.documentElement.lang = lang;
  $('lDe').setAttribute('aria-pressed', lang==='de'); $('lEn').setAttribute('aria-pressed', lang==='en');
  const tt = u('title'); const q = tt.split(' ');
  $('title').innerHTML = esc(q.slice(0,-1).join(' ')) + ' <em>' + esc(q.slice(-1)[0]) + '</em>';
  document.title = tt + ' | ams OSRAM';
  $('subtitle').textContent = u('subtitle');
  $('whatIs').textContent = u('whatIs'); $('whyHead').textContent = u('whyHead'); $('whyTxt').textContent = u('whyTxt'); $('whyEnd').textContent = u('whyEnd');
  $('whyHum').textContent = u('whyHum'); $('whyAi').textContent = u('whyAi');
  $('whyHumL').innerHTML = u('whyHumL').split(' | ').map(x => `<li>${esc(x)}</li>`).join('');
  $('whyAiL').innerHTML = u('whyAiL').split(' | ').map(x => `<li>${esc(x)}</li>`).join('');
  $('learnHead').textContent = u('learnHead'); $('learnLead').textContent = u('learnLead');
  $('bbs').innerHTML = D.bb.map((b,i) => `<div class="bb${i===5?' hl':''}"><strong>${esc(T(b.name))}</strong><p>${esc(T(b.q))}</p><p class="e">„${esc(T(b.ex))}“</p></div>`).join('');
  $('weakLbl').textContent = u('weakLbl'); $('weakEx').textContent = '„' + u('weakEx') + '“';
  $('strongLbl').textContent = u('strongLbl');
  $('strongEx').innerHTML = D.bb.map(b => `<em>${esc(T(b.name))}:</em> ${esc(T(b.ex))}`).join('<br>');
  $('motto').textContent = u('motto'); $('startBtn').textContent = S.cur ? u('tryNow') : u('start');
  $('privacy1').textContent = u('privacy'); $('privacy2').textContent = u('privacy');
  $('instr').textContent = u('instr'); $('task').textContent = u('task'); $('prompt').placeholder = u('ph');
  $('sendBtn').textContent = u('send'); $('scafBtn').textContent = u('scaffoldBtn'); $('exBtn').textContent = u('exampleBtn'); $('bbBtn').textContent = u('bbBtn');
  $('brLbl').textContent = u('brightness'); $('swHead').textContent = u('switchHead');
  $('improveBtn').textContent = u('improve'); $('finBtn').textContent = u('finaleBtn');
  $('doneTxt').textContent = u('areaDone'); $('againBtn').textContent = u('again'); $('revealBtn').textContent = u('reveal');
  $('resetBtn').textContent = u('reset'); $('coach2').textContent = u('coach2'); $('useEx').textContent = u('useExample');
  $('shClose').textContent = u('close');
  roundLabel();
}

// ---------- Infokarte ----------
let lastFocus = null;
function openSheet(k, i, all){
  const a = AREA[k], h = a.hot[i], on = all || S.done[k] || i < S.open[k];
  lastFocus = lastFocus || document.activeElement;
  $('shCap').textContent = T(a.name);
  if(on){
    $('shTitle').textContent = T(h.title);
    $('shBody').innerHTML = `<img alt="" src="${h.img}"><p>${esc(T(S.tech[k] ? h.tech : h.easy))}</p>`;
    const list = all ? null : a.hot.map((x,j) => j).filter(j => S.done[k] || j < S.open[k]);
    if(list && list.length > 1){
      const p = list[(list.indexOf(i) - 1 + list.length) % list.length], n = list[(list.indexOf(i) + 1) % list.length];
      $('shBody').insertAdjacentHTML('beforeend', `<div class="nav"><button class="btn ghost" data-go="${p}">←</button><button class="btn ghost" data-go="${n}">→</button></div>`);
      $('shBody').querySelectorAll('[data-go]').forEach(b => b.onclick = () => openSheet(k, +b.dataset.go));
    }
  } else {
    $('shTitle').textContent = T(a.name);
    $('shBody').innerHTML = `<p>${esc(u('locked'))}</p>`;
  }
  $('backdrop').classList.add('open'); $('sheet').classList.add('open'); $('sheet').focus({preventScroll:true});
}
function closeSheet(){
  if(!$('sheet').classList.contains('open')) return;
  $('backdrop').classList.remove('open'); $('sheet').classList.remove('open');
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); lastFocus = null;
}
let ty = null, tx = null;
$('sheet').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = $('sheet').scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
$('sheet').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if(ty !== null && e.changedTouches[0].clientY - ty > 80) closeSheet();
  else if(Math.abs(dx) > 60){ const b = $('shBody').querySelectorAll('[data-go]'); if(b.length) b[dx < 0 ? 1 : 0].click(); }
  ty = null;
});
$('backdrop').onclick = closeSheet; $('shClose').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

// ---------- Standmodus ----------
if(new URLSearchParams(location.search).get('stand') === '1'){
  let idle; const arm = () => { clearTimeout(idle); idle = setTimeout(() => { if(S.view !== 'learn' || S.cur) { S = fresh(); show('learn'); } }, 120000); };
  ['pointerdown','keydown','touchstart','scroll'].forEach(ev => document.addEventListener(ev, arm, {passive:true})); arm();
}

// ---------- Ereignisse ----------
$('lDe').onclick = () => { lang = 'de'; show(S.view); };
$('lEn').onclick = () => { lang = 'en'; show(S.view); };
$('startBtn').onclick = () => show(S.cur && !S.done[S.cur] ? 'play' : 'pick');
$('bbBtn').onclick = () => show('learn');
$('sendBtn').onclick = send;
$('prompt').addEventListener('keydown', e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); });
$('scafBtn').onclick = () => { $('prompt').value = u('scaffold'); $('prompt').focus(); };
$('exBtn').onclick = () => { const t = $('prompt'); const ex = u('exampleTxt'); if(!t.value.includes(ex)) t.value = (t.value.trim() + '\n' + ex).trim(); t.focus(); };
$('useEx').onclick = () => { $('prompt').value = T(AREA[S.cur].example); $('coachEx').hidden = true; S.last.showEx = false; go($('playPanel')); $('prompt').focus({preventScroll:true}); };
$('improveBtn').onclick = () => { go($('playPanel')); $('prompt').focus({preventScroll:true}); };
$('finBtn').onclick = completeArea;
$('againBtn').onclick = () => show('pick');
$('revealBtn').onclick = () => show('end');
$('resetBtn').onclick = () => { S = fresh(); $('prompt').value = ''; show('learn'); };

show('learn');
</script>
